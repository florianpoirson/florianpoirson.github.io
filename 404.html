<!DOCTYPE html>
<html lang="fr" data-lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Séverine Williams</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
:root{
  --crimson:#A51C30;
  --crimson-dk:#8C1728;
  --ink:#1E1E1E;
  --body:#333333;
  --muted:#6E6E6E;
  --paper:#FFFFFF;
  --grey:#F4F3F1;
  --rule:#D8D6D2;
  --dark:#1E1E1E;
  --dark-2:#141414;
  --on-dark:#FFFFFF;
  --on-dark-2:#B9B7B4;
  --dark-rule:#3A3A3A;
  --focus:#2F5D7C;

  --serif:"EB Garamond", Garamond, "Times New Roman", Georgia, serif;
  --sans:"Inter", "Helvetica Neue", Arial, sans-serif;
  --pad:clamp(1.15rem, 4vw, 2.75rem);
  --max:75rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --crimson:#E2586B; --crimson-dk:#B32639;
    --ink:#F2F1EF; --body:#D5D3D0; --muted:#9B9996;
    --paper:#131313; --grey:#1B1B1B; --rule:#343434;
    --dark:#0C0C0C; --dark-2:#080808; --dark-rule:#2E2E2E;
    --focus:#7FB4D8;
  }
}
:root[data-theme="dark"]{
  --crimson:#E2586B; --crimson-dk:#B32639;
  --ink:#F2F1EF; --body:#D5D3D0; --muted:#9B9996;
  --paper:#131313; --grey:#1B1B1B; --rule:#343434;
  --dark:#0C0C0C; --dark-2:#080808; --dark-rule:#2E2E2E; --focus:#7FB4D8;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{animation:none!important; transition:none!important} }
body{
  margin:0; background:var(--paper); color:var(--body);
  font-family:var(--sans); font-size:1.0625rem; line-height:1.65;
  font-weight:400; -webkit-font-smoothing:antialiased;
}
html[data-lang="fr"] .en{display:none!important}
html[data-lang="en"] .fr{display:none!important}
img{max-width:100%; height:auto; display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:3px}
h1,h2,h3,h4{font-family:var(--serif); font-weight:400; color:var(--ink); margin:0; letter-spacing:-0.005em; text-wrap:balance}
p{margin:0 0 1.1em}
p:last-child{margin-bottom:0}
sup{font-size:.68em}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.skip{position:absolute; left:-9999px; background:var(--ink); color:#fff; padding:.7rem 1rem; z-index:99}
.skip:focus{left:.5rem; top:.5rem}

.page{max-width:var(--max); margin-inline:auto; padding-inline:var(--pad)}

/* ---------- bandeau d'information ---------- */
.alert{background:var(--crimson-dk); color:#fff}
.alert-in{
  max-width:var(--max); margin-inline:auto; padding:.55rem var(--pad);
  display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
  font-size:.82rem; font-weight:500;
}
.alert a{color:#fff; text-decoration:underline; text-underline-offset:.2em}
.alert .sp{margin-left:auto}
.lang{
  font-family:var(--sans); font-size:.78rem; font-weight:600; letter-spacing:.04em;
  background:transparent; color:#fff; border:1px solid rgba(255,255,255,.55);
  padding:.25rem .6rem; cursor:pointer;
}
.lang:hover{background:#fff; color:var(--crimson-dk)}
.lang b{font-weight:700}

/* ---------- en-tête ---------- */
.bar{position:sticky; top:0; z-index:40; background:var(--paper); border-bottom:1px solid var(--rule)}
.bar-in{max-width:var(--max); margin-inline:auto; padding:1.05rem var(--pad); display:flex; align-items:center; gap:2rem}
.sigle{
  font-family:var(--serif); font-size:1.5rem; line-height:1.05; color:var(--ink);
  text-decoration:none; margin-right:auto; letter-spacing:.005em;
}
.sigle .sig-sub{display:block; font-family:var(--sans); font-size:.68rem; font-weight:500; color:var(--muted); margin-top:.2rem; letter-spacing:.02em}
nav.menu{display:flex; gap:1.6rem; font-size:.9rem; font-weight:500}
nav.menu a{color:var(--ink); text-decoration:none; padding-bottom:.3rem; border-bottom:2px solid transparent}
nav.menu a:hover{border-bottom-color:var(--crimson)}
@media (max-width:900px){ nav.menu{display:none} .sigle{font-size:1.3rem} }

/* ---------- boutons et liens « en savoir plus » ---------- */
.btn{
  display:inline-block; font-family:var(--sans); font-size:.92rem; font-weight:600;
  text-decoration:none; padding:.85rem 1.6rem; background:var(--crimson); color:#fff;
  border:2px solid var(--crimson); line-height:1.25;
}
.btn:hover{background:transparent; color:var(--crimson)}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--ink)}
.btn-ghost:hover{background:var(--ink); color:var(--paper)}
.btn-row{display:flex; flex-wrap:wrap; gap:.85rem; margin-top:2rem}
.dark .btn, .crimson .btn{background:#fff; color:var(--dark); border-color:#fff}
.dark .btn:hover, .crimson .btn:hover{background:transparent; color:#fff}
.more{
  display:inline-block; margin-top:1rem; font-size:.9rem; font-weight:600; color:var(--crimson);
  text-decoration:none; border-bottom:2px solid transparent;
}
.more:hover{border-bottom-color:var(--crimson)}
.more::after{content:" A"; font-weight:700}
.crimson .more, .dark .more{color:#fff}
.crimson .more:hover, .dark .more:hover{border-bottom-color:#fff}

/* ---------- héros ---------- */
.hero-dark{background:var(--dark); color:var(--on-dark); position:relative; overflow:hidden}
.hero-in{
  max-width:var(--max); margin-inline:auto; padding:0 var(--pad);
  display:grid; grid-template-columns:minmax(0,1fr) 34%; align-items:stretch; gap:0;
}
.hero-txt{padding:clamp(3.5rem,8vw,7rem) clamp(1.5rem,4vw,4rem) clamp(3.5rem,8vw,7rem) 0}
.hero-dark h1{
  font-size:clamp(2.4rem,1.2rem + 4.8vw,4.6rem); line-height:1.02; color:#fff;
  letter-spacing:-0.018em; margin-bottom:1.35rem; max-width:14ch;
}
.hero-dark .lead{color:var(--on-dark-2); font-size:clamp(1.05rem,1rem + .35vw,1.25rem); max-width:44ch; margin-bottom:2rem}
.hero-img{position:relative; min-height:26rem}
.hero-img img{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 18%;
  filter:grayscale(1) contrast(1.08) brightness(.92);
}
.hero-img::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(90deg, var(--dark) 0%, rgba(30,30,30,.55) 28%, rgba(30,30,30,0) 70%);
}
.creds{
  font-family:var(--sans); font-size:.82rem; line-height:1.85; color:var(--on-dark-2);
  border-top:3px solid var(--crimson); padding-top:1.1rem; margin:2.5rem 0 0; max-width:50ch;
}
.creds b{color:#fff; font-weight:600}
@media (max-width:860px){
  .hero-in{grid-template-columns:minmax(0,1fr)}
  .hero-txt{padding:clamp(2.5rem,7vw,4rem) 0}
  .hero-img{min-height:15rem; order:-1; margin-inline:calc(var(--pad)*-1)}
  .hero-img::after{background:linear-gradient(180deg, rgba(30,30,30,.15) 40%, var(--dark) 100%)}
}

/* ---------- sections ---------- */
section{padding-block:clamp(3.25rem,7vw,5.5rem)}
section.band{background:var(--grey)}
section.dark{background:var(--dark); color:var(--on-dark-2)}
section.dark h2, section.dark h3{color:#fff}
section.crimson{background:var(--crimson-dk); color:rgba(255,255,255,.85)}
section.crimson h2, section.crimson h3{color:#fff}
h2{font-size:clamp(2rem,1.3rem + 2.4vw,3.2rem); line-height:1.08; margin-bottom:1.1rem; max-width:18ch}
h3{font-size:1.35rem; line-height:1.25; margin-bottom:.45rem}
.lead{font-size:clamp(1.08rem,1rem + .4vw,1.28rem); line-height:1.6; color:var(--body); max-width:56ch; margin-bottom:2.25rem}
section.dark .lead, section.crimson .lead{color:rgba(255,255,255,.82)}
.ligne{font-size:.95rem; color:var(--muted); margin-top:1.75rem; max-width:62ch}
.ligne a{color:var(--crimson); font-weight:600; text-decoration:none; border-bottom:2px solid transparent}
.ligne a:hover{border-bottom-color:var(--crimson)}

/* trois colonnes */
.trio{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:2.5rem}
.trio > div{border-top:3px solid var(--crimson); padding-top:1.1rem}
.trio p{color:var(--muted); font-size:1rem; margin:0}
@media (max-width:860px){ .trio{grid-template-columns:minmax(0,1fr); gap:1.9rem} }

/* étiquettes */
.tags{display:flex; flex-wrap:wrap; gap:.55rem; margin:0; padding:0; list-style:none}
.tags li{font-size:.92rem; font-weight:500; color:var(--ink); background:var(--paper); border:1px solid var(--rule); padding:.55rem .9rem}
section.band .tags li{background:var(--paper)}

/* étapes numérotées */
.steps{list-style:none; counter-reset:s; padding:0; margin:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:2.5rem}
.steps li{counter-increment:s; border-top:1px solid var(--rule); padding-top:1.1rem}
.steps li::before{
  content:counter(s); display:block; font-family:var(--serif); font-size:2.1rem; line-height:1;
  color:var(--crimson); margin-bottom:.5rem;
}
.steps p{color:var(--muted); font-size:1rem; margin:0}
@media (max-width:860px){ .steps{grid-template-columns:minmax(0,1fr); gap:1.75rem} }

/* modules du programme phare */
.mods{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:2.25rem 3rem}
.mods > li{border-top:2px solid rgba(255,255,255,.4); padding-top:1.1rem}
.mods > li::before{display:none}
.mods h3{color:#fff; font-size:1.3rem}
.mods p{color:rgba(255,255,255,.8); font-size:1rem; margin:0}
@media (max-width:860px){ .mods{grid-template-columns:minmax(0,1fr); gap:1.75rem} }

/* faits vérifiables */
.faits{list-style:none; margin:0; padding:0; border-top:1px solid var(--rule)}
.faits li{padding:1.1rem 0; border-bottom:1px solid var(--rule); font-size:1.05rem; line-height:1.55; color:var(--ink)}
.faits .g{color:var(--muted)}
.faits .src{
  display:inline-block; font-size:.76rem; font-weight:600; color:var(--crimson);
  text-decoration:none; border-bottom:2px solid var(--crimson); margin-left:.5rem; white-space:nowrap;
}
.faits .src:hover{color:var(--ink); border-bottom-color:var(--ink)}

/* blocs dépliables */
.plus{margin-top:2.5rem; border-top:3px solid var(--crimson)}
.plus > summary{
  cursor:pointer; list-style:none; padding:1.1rem 2rem 1.1rem 0; position:relative;
  font-size:.95rem; font-weight:600; color:var(--crimson);
}
.plus > summary::-webkit-details-marker{display:none}
.plus > summary::after{content:"+"; position:absolute; right:.2rem; top:1rem; font-size:1.2rem}
.plus[open] > summary::after{content:"3"}
.plus-body{padding-bottom:2rem}
.sous-titre{font-family:var(--serif); font-size:1.5rem; color:var(--ink); margin:2.5rem 0 .75rem}
.plus-body .sous-titre:first-child{margin-top:.5rem}

/* listes CV et sources */
.cv{margin:0; padding:0; list-style:none}
.cv > li{display:grid; grid-template-columns:7rem minmax(0,1fr); gap:0 1.75rem; padding:.9rem 0; border-bottom:1px solid var(--rule); align-items:baseline}
.cv > li:first-child{border-top:1px solid var(--rule)}
.cv .an{font-size:.82rem; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums}
.cv .quoi{font-size:1rem; color:var(--ink)}
.cv .quoi em{font-style:normal; color:var(--muted); font-size:.93rem; display:block; margin-top:.15rem}
.cv .quoi a.src{display:inline-block; font-size:.74rem; font-weight:600; color:var(--crimson); text-decoration:none; border-bottom:2px solid var(--crimson); margin:.3rem .5rem 0 0; white-space:nowrap}
@media (max-width:640px){ .cv > li{grid-template-columns:minmax(0,1fr); gap:.2rem} }
.refs{list-style:none; margin:0; padding:0; border-top:1px solid var(--rule)}
.refs li{border-bottom:1px solid var(--rule)}
.refs a{display:block; padding:.95rem 0; text-decoration:none; color:var(--ink); font-size:1rem; line-height:1.45}
.refs a:hover .t{border-bottom:2px solid var(--crimson)}
.refs .t{border-bottom:2px solid transparent}
.refs .u{display:block; font-size:.76rem; color:var(--muted); margin-top:.25rem; word-break:break-all}

/* FAQ */
.faq{border-top:1px solid var(--rule)}
.faq details{border-bottom:1px solid var(--rule)}
.faq summary{cursor:pointer; list-style:none; position:relative; padding:1.2rem 2.5rem 1.2rem 0; font-family:var(--serif); font-size:1.28rem; color:var(--ink)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+"; position:absolute; right:.3rem; top:1.15rem; font-family:var(--sans); font-size:1.25rem; color:var(--crimson)}
.faq details[open] summary::after{content:"3"}
.faq .rep{padding:0 0 1.4rem; color:var(--muted); max-width:62ch}

/* contact */
.contact-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(14rem,1fr)); gap:2rem; border-top:1px solid var(--rule); padding-top:1.75rem}
.ct h3{font-family:var(--sans); font-size:.76rem; font-weight:700; color:var(--muted); letter-spacing:.06em; margin-bottom:.45rem}
.ct a{font-size:1.1rem; color:var(--ink); text-decoration:none; border-bottom:2px solid var(--rule)}
.ct a:hover{border-bottom-color:var(--crimson)}
.ct .pr{color:var(--muted); font-size:.85rem; margin-top:.3rem}
form.msg{margin-top:3rem; max-width:42rem}
form.msg label{display:block; font-size:.82rem; font-weight:600; color:var(--ink); margin-bottom:.35rem}
form.msg input, form.msg select, form.msg textarea{
  width:100%; font-family:var(--sans); font-size:1rem; color:var(--ink); background:var(--paper);
  border:1px solid var(--rule); padding:.7rem .8rem; margin-bottom:1.1rem; border-radius:0;
}
form.msg textarea{min-height:8rem; resize:vertical}
form.msg input:focus, form.msg select:focus, form.msg textarea:focus{border-color:var(--crimson)}
.consent{display:flex; gap:.65rem; align-items:flex-start; font-size:.85rem; color:var(--muted); margin-bottom:1.3rem}
.consent input{width:auto; margin:.3rem 0 0}

/* pied de page sombre */
footer{background:var(--dark-2); color:var(--on-dark-2); padding-block:3.5rem 2.5rem; font-size:.92rem}
footer h4{font-family:var(--sans); font-size:.74rem; font-weight:700; color:#fff; letter-spacing:.08em; margin:0 0 .85rem; text-transform:uppercase}
.foot-cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(12rem,1fr)); gap:2.5rem; padding-bottom:2.5rem; border-bottom:1px solid var(--dark-rule)}
.foot-cols ul{list-style:none; margin:0; padding:0; line-height:2.05; font-size:.88rem}
.foot-cols a{color:var(--on-dark-2); text-decoration:none}
.foot-cols a:hover{color:#fff; text-decoration:underline; text-underline-offset:.2em}
.legal{margin-top:2.25rem}
.legal details{border-bottom:1px solid var(--dark-rule)}
.legal summary{cursor:pointer; list-style:none; position:relative; padding:.9rem 1.8rem .9rem 0; font-size:.86rem; font-weight:600; color:#fff}
.legal summary::-webkit-details-marker{display:none}
.legal summary::after{content:"+"; position:absolute; right:.2rem; color:var(--crimson); font-size:1.05rem}
.legal details[open] summary::after{content:"3"}
.legal .txt{font-size:.82rem; line-height:1.7; color:var(--on-dark-2); padding-bottom:1.6rem; max-width:64ch}
.legal .txt h4{font-size:.8rem; letter-spacing:0; text-transform:none; margin:1.2rem 0 .35rem; font-family:var(--sans)}
.legal .txt h4:first-child{margin-top:0}
.legal .txt a{color:#fff}
.todo{color:var(--crimson); font-weight:700}
.copy{margin-top:2.25rem; font-size:.78rem; color:#8A8886; line-height:1.8}

/* apparition unique au chargement */
.reveal{opacity:0; transform:translateY(10px); animation:rise .8s cubic-bezier(.2,.7,.3,1) forwards}
.reveal.d1{animation-delay:.05s} .reveal.d2{animation-delay:.16s} .reveal.d3{animation-delay:.28s}
@keyframes rise{to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){ .reveal{opacity:1; transform:none} }
</style>
</head>
<body>
<div class="dark hero-dark">
  <div class="hero-in">
    <div class="hero-txt">
      <h1>Cette page n’existe pas.</h1>
      <p class="lead">Le lien que vous avez suivi est peut-être ancien ou incomplet.<br>
      <span lang="en">This page does not exist. The link you followed may be outdated or incomplete.</span></p>
      <div class="btn-row" style="margin-top:0">
        <a class="btn" href="/">Retour à l’accueil</a>
        <a class="btn btn-ghost" href="/en/" style="border-color:#fff; color:#fff">English version</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
